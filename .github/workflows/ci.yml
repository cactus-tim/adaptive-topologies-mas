name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: 'uv.lock'
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --frozen --all-extras
      - name: Ruff check
        run: uv run ruff check src/atm tests
      - name: Ruff format check
        run: uv run ruff format --check src/atm tests
      - name: Mypy strict
        run: uv run mypy --strict src/atm

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: 'uv.lock'
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --frozen --all-extras
      - name: Run unit tests
        run: uv run pytest tests/unit/ -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atm
          POSTGRES_PASSWORD: atm
          POSTGRES_DB: atm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATM_INTEGRATION_PG: '1'
      ATM_ENABLE_PG_TESTS: '1'
      PG_DSN: postgresql+asyncpg://atm:atm@localhost:5432/atm
      ATM_PG_DSN: postgresql+asyncpg://atm:atm@localhost:5432/atm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: 'uv.lock'
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync --frozen --all-extras
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U atm && exit 0
            sleep 1
          done
          exit 1
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Run integration tests
        run: uv run pytest tests/integration/ -q -m "not requires_docker and not live"
