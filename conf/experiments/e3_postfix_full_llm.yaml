# Companion to e3_postfix_full.yaml — same task/shuffle/seed grid but the
# adaptive runs use topology_router=llm instead of rule.
#
# Run BOTH files to get the rule-vs-llm comparison without duplicate cells in
# either grid.  Together they replicate the 5-config matrix that e3_full had
# (chain, star, mesh, adaptive_rule, adaptive_llm).
#
# Static (chain/star/mesh) cells in this file are NOT run again — sweep is
# narrowed to topology.name=[adaptive] only.  Re-using e3_postfix_full.yaml
# for the statics avoids duplicate spend.
#
# Cells: 4 tasks × 8 shuffles × 3 seeds × 1 topology = 96 cells.
# ~45 min on p=12, ~$6 + judge ~$1.

include: e3_postfix_full.yaml

name: e3_postfix_full_llm

topology:
  name: adaptive
  max_iterations: 12
  extra:
    adaptive:
      phase_router: rule
      topology_router: llm   # ← the difference vs e3_postfix_full
      subgraph_max_iterations: 4
      switch_guards: true
      switch_guards_config:
        min_dwell_iters: 1
        cooldown_iters: 2
        max_per_run: 6
        max_per_phase: 3
      planning_max_iter: 3
      exec_max_iter: 5
      verify_max_iter: 2
    debate:
      max_rounds: 2
    hierarchical:
      max_rounds: 2

budget:
  per_call_usd: 0.05
  per_run_usd: 0.40
  per_experiment_usd: 10.0
  warn_ratio: 0.85

grid:
  parallelism: 12
  fail_fast: false
  seeds: [42, 43, 44]
  sweep:
    task.name:
      - humaneval
      - gsm8k
      - commongen
      - dabench
    task.shuffle_seed: [0, 1, 2, 3, 4, 5, 6, 7]
    # adaptive-only (statics covered by e3_postfix_full.yaml)
    topology.name: [adaptive]
