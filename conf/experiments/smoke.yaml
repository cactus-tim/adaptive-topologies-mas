name: m6_smoke
seed: 42

task:
  name: fibonacci_smoke
  input: "Write a Python function fib(n) that returns the n-th Fibonacci number. Compute fib(10)."

model:
  default: "fake:scripted"
  by_role:
    planner: "fake:scripted"
    executor: "fake:scripted"
    critic: "fake:scripted"
    researcher: "fake:scripted"
  # Fixture paths for FakeLLM scripted mode (relative to project root or absolute).
  # Resolved by _build_llm_wrappers in runner.py.
  # Use chain topology fixtures for the default smoke config (topology.name=chain).
  fake_fixtures:
    planner: "tests/fixtures/llm/m6_chain_planner.yaml"
    executor: "tests/fixtures/llm/m6_chain_executor.yaml"
    critic: "tests/fixtures/llm/m6_chain_critic.yaml"
    researcher: "tests/fixtures/llm/m6_chain_planner.yaml"

agents:
  set: canonical_4

topology:
  name: chain
  max_iterations: 12
  extra: {}

budget:
  per_call_usd: 0.10
  per_run_usd: 0.50
  per_experiment_usd: 50.0

observability:
  pg_dsn: "${oc.env:PG_DSN,postgresql+asyncpg://localhost/atm_test}"
  parquet_dir: "data/experiments"
  callback_sync: true
