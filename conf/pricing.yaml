# ATM LLM Pricing Table
# Source: OpenAI https://openai.com/api/pricing/, Anthropic https://www.anthropic.com/pricing,
# Cerebras https://www.cerebras.ai/pricing + https://inference-docs.cerebras.ai/models/overview
# Check-date: 2026-05; mark uncertain values with # VERIFY
#
# Active experimental lineup (Variant B'.1, decided 2026-05-15):
#   - workers / critic / summarizer / router / HITL-sim → cerebras:gpt-oss-120b
#   - judge (LLM-as-judge, evaluation) → openai:gpt-4.1-mini (cross-family independence)
#   - confirmation primary (cross-family on Cerebras) → cerebras:zai-glm-4.7
#   - confirmation cross-family → openai:gpt-4o
version: 1

models:
  openai:gpt-4o:
    # GPT-4o — used ONLY for cross-family confirmation runs (~1800 runs in E1–E4 follow-up).
    # Source: OpenAI pricing page (2026-05)
    input_per_1k: 0.0025
    output_per_1k: 0.010
    cached_input_per_1k: 0.00125  # 50 % discount for cached prompt tokens

  openai:gpt-4o-mini:
    # GPT-4o mini — retained for back-compat with existing tests and as fallback.
    # NOT used in active experimental lineup (superseded by gpt-4.1-mini for judge,
    # cerebras:gpt-oss-120b for compute roles).
    # Source: OpenAI pricing page (2026-04)
    input_per_1k: 0.00015
    output_per_1k: 0.00060
    cached_input_per_1k: 0.000075

  openai:gpt-4.1-mini:
    # GPT-4.1 mini — primary LLM-as-judge model (self-consistency × 3).
    # Used because it sits in a different model family from compute-side
    # (Cerebras gpt-oss) — independent evaluator argument for the defense.
    # Source: OpenAI pricing page (2026-05) — $0.40 in / $1.60 out per 1M
    input_per_1k: 0.00040
    output_per_1k: 0.00160
    cached_input_per_1k: 0.00010   # 75% cache discount per OpenAI pricing

  anthropic:claude-3-5-sonnet-latest:
    # Claude 3.5 Sonnet — standard token pricing
    # Source: Anthropic pricing page (2026-04)
    input_per_1k: 0.003
    output_per_1k: 0.015
    cache_read_per_1k: 0.0003    # Prompt Cache read
    cache_write_per_1k: 0.00375  # Prompt Cache write (1.25× input rate)

  anthropic:claude-3-5-haiku-latest:
    # Claude 3.5 Haiku — lower cost tier
    # Source: Anthropic pricing page (2026-04)
    input_per_1k: 0.00080  # VERIFY — Haiku pricing adjusted as of late 2025
    output_per_1k: 0.00400
    cache_read_per_1k: 0.000080   # Prompt Cache read
    cache_write_per_1k: 0.0010    # Prompt Cache write

  # REMOVED 2026-05-27 — llama3.1-8b is being deprecated from Cerebras Cloud.
  # Entry retained for back-compat with existing tests + provider docs only;
  # MUST NOT appear in any conf/experiments/*.yaml after 2026-05-27.
  cerebras:llama3.1-8b:
    # Cerebras llama3.1-8b — 8B tier (DEPRECATED, do not use in new experiments)
    # Source: Cerebras Cloud pricing (2026-04)
    input_per_1k: 0.0001
    output_per_1k: 0.0001
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0

  cerebras:gpt-oss-120b:
    # Cerebras gpt-oss-120b — primary compute model (all worker roles + critic + summarizer + router + HITL-sim).
    # OpenAI's open-weight 120B MoE, ~3000 tok/s on Cerebras WSE (measured ~2241 t/s, AI Analysis).
    # Source: Cerebras pricing (2026-05) — $0.35 in / $0.75 out per 1M (Sim.ai card, conservative;
    # Cerebras blog announced $0.25/$0.69 as launch price — use $0.35/$0.75 until verified on dashboard).
    input_per_1k: 0.00035
    output_per_1k: 0.00075
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0

  cerebras:zai-glm-4.7:
    # Cerebras Z.ai GLM 4.7 — 355B preview model, ~1000 tok/s.
    # Used for cross-family confirmation runs on Cerebras (different model family from gpt-oss).
    # Status: PREVIEW (Cerebras catalog) — pricing not yet published publicly.
    # Source: https://inference-docs.cerebras.ai/models/overview
    input_per_1k: 0.0006  # VERIFY — preview-tier estimate; sync with Cerebras dashboard before E4 confirmation
    output_per_1k: 0.0022  # VERIFY
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0

  fake:deterministic:
    # FakeLLM used in all unit/integration tests — zero cost
    input_per_1k: 0.0
    output_per_1k: 0.0
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0

  fake:scripted:
    # FakeLLM scripted mode — used in M6 E2E and runner integration tests.
    # Non-zero rates allow budget-exceed tests (e.g. grid_fail_fast) to trigger
    # BudgetExceededError on per-call cost estimates; rates are low enough that
    # normal test budgets (per_run_usd >= 0.1) are never reached.
    input_per_1k: 0.01
    output_per_1k: 0.01
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0

  fake:echo:
    # FakeLLM echo mode — used in runner unit tests
    input_per_1k: 0.0
    output_per_1k: 0.0
    cached_input_per_1k: 0.0
    cache_read_per_1k: 0.0
    cache_write_per_1k: 0.0
