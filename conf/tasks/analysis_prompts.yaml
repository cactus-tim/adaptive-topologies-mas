# Analysis task prompts for ATM benchmark
# Each entry: id, prompt, data_csv (inline), expected_pattern, rubric, structural_checks

prompts:
  - id: "analysis/sales_trend"
    prompt: "Analyze the monthly sales data and identify the dominant trend."
    data_csv: |
      month,sales
      Jan,1200
      Feb,1350
      Mar,1500
      Apr,1650
      May,1800
    expected_pattern: "upward|increasing|growth|trend"
    rubric: "Identify trend direction, magnitude, and rate of change. Mention specific months."
    structural_checks:
      - {type: "contains", value: "trend"}
      - {type: "regex", value: "(?i)(upward|increasing|growth|rise)"}
      - {type: "min_length", value: "50"}

  - id: "analysis/temperature_anomaly"
    prompt: "Examine the temperature readings and detect any anomalies."
    data_csv: |
      day,temp_c
      1,22.1
      2,21.8
      3,23.0
      4,35.7
      5,22.5
      6,21.9
    expected_pattern: "anomaly|outlier|spike|day 4|35"
    rubric: "Identify anomalous data points, quantify deviation from mean, explain potential causes."
    structural_checks:
      - {type: "contains", value: "anomal"}
      - {type: "regex", value: "(?i)(day 4|35\\.7|outlier|spike)"}
      - {type: "min_length", value: "80"}

  - id: "analysis/market_share"
    prompt: "Analyze the market share data and determine the competitive landscape."
    data_csv: |
      company,share_pct
      Alpha,42.5
      Beta,28.3
      Gamma,15.2
      Others,14.0
    expected_pattern: "Alpha|dominant|leader|largest"
    rubric: "Rank companies by share, identify market leader, discuss concentration."
    structural_checks:
      - {type: "contains", value: "Alpha"}
      - {type: "regex", value: "(?i)(dominant|leader|largest|market share)"}
      - {type: "min_length", value: "60"}

  - id: "analysis/expense_breakdown"
    prompt: "Evaluate the department expense breakdown and highlight inefficiencies."
    data_csv: |
      department,budget,actual
      Engineering,50000,48000
      Marketing,30000,41000
      Operations,25000,24500
      HR,15000,16200
    expected_pattern: "Marketing|over budget|exceeded|inefficien"
    rubric: "Compare budget vs actual per department, compute variances, flag overspending."
    structural_checks:
      - {type: "contains", value: "Marketing"}
      - {type: "regex", value: "(?i)(over.budget|exceed|inefficien|variance)"}
      - {type: "min_length", value: "100"}

  - id: "analysis/user_retention"
    prompt: "Examine user retention cohorts and assess churn risk."
    data_csv: |
      cohort,month_0,month_1,month_2,month_3
      2024-Q1,1000,780,610,490
      2024-Q2,1200,900,720,580
      2024-Q3,950,700,540,410
    expected_pattern: "churn|retention|drop|decline"
    rubric: "Calculate retention rates per cohort, identify worst cohort, recommend action."
    structural_checks:
      - {type: "regex", value: "(?i)(churn|retention|drop|decline)"}
      - {type: "min_length", value: "100"}

  - id: "analysis/product_performance"
    prompt: "Assess product performance metrics and rank by overall score."
    data_csv: |
      product,revenue,nps,support_tickets
      Widget A,85000,42,120
      Widget B,62000,67,45
      Widget C,94000,31,210
      Widget D,71000,58,88
    expected_pattern: "Widget B|best|highest NPS|lowest tickets"
    rubric: "Multi-dimensional ranking considering revenue, NPS and support load. Weighted analysis."
    structural_checks:
      - {type: "contains", value: "NPS"}
      - {type: "regex", value: "(?i)(rank|score|best|worst|widget)"}
      - {type: "min_length", value: "80"}
