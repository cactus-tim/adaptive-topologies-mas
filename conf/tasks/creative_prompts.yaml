version: 1
prompts:
  - id: c1
    prompt: "Write a short story (150-200 words) about a lighthouse keeper who discovers an unexpected visitor one stormy night."
    rubric: "Evaluate for vivid imagery, narrative tension, and satisfying resolution. Look for sensory details, character development, and coherent plot arc."

  - id: c2
    prompt: "Write a poem (12-16 lines) about the feeling of watching the last autumn leaves fall from a tree."
    rubric: "Evaluate for use of poetic devices (metaphor, imagery, rhythm), emotional resonance, and originality. The poem should evoke the melancholy and beauty of seasonal change."

  - id: c3
    prompt: "Write a persuasive paragraph (100-130 words) arguing that public libraries are essential infrastructure for a democratic society."
    rubric: "Evaluate for clarity of argument, use of supporting evidence or reasoning, logical structure, and persuasive language. The paragraph should have a clear thesis, supporting points, and a strong closing statement."

  - id: c4
    prompt: "Write a product description (80-120 words) for a fictional gadget that translates animal sounds into human language."
    rubric: "Evaluate for creativity, engaging tone, clear feature highlights, and a compelling call to action. The description should appeal to a consumer audience and make the product sound desirable."

  - id: c5
    prompt: "Write a short dialogue (10-15 exchanges) between two people meeting for the first time at a bus stop during a power outage."
    rubric: "Evaluate for naturalistic dialogue, distinct character voices, subtext, and a sense of atmosphere. The conversation should feel authentic and reveal something about both characters."

  - id: c6
    prompt: "Write a haiku sequence (3 haikus) that captures the transition from dawn to noon to dusk."
    rubric: "Evaluate for adherence to the 5-7-5 syllable structure, use of seasonal or natural imagery (kigo), and the progression of time across the three haikus. Each haiku should stand alone yet connect thematically."

  - id: c7
    prompt: "Write a brief myth (200-250 words) explaining why the ocean is salty, in the style of an ancient storytelling tradition."
    rubric: "Evaluate for imaginative world-building, cultural authenticity of tone, narrative flow, and how effectively the story explains the phenomenon. The myth should feel timeless and rooted in oral tradition."

  - id: c8
    prompt: "Write a journal entry (150-180 words) from the perspective of an astronaut on their first day aboard a space station, looking down at Earth."
    rubric: "Evaluate for first-person voice authenticity, emotional depth, descriptive language conveying the awe of space, and plausible detail. The entry should feel personal and emotionally resonant."
