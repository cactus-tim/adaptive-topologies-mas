# Per-role tools policy (arch.md §5.3).
# Ships with currently-registered tool names only. Add tools after registering them.
global:
  - calculator
  - file_read
  - duckduckgo_search
  - url_fetch

per_role:
  Planner:
    - plan_update
    - todo_write
  Executor:
    - code_run
    - file_write
  Critic:
    - diff
    - lint
    - test_run
  Researcher:
    - semantic_search
# NOTE: legacy spec mentions arxiv_search; substitute with the registered search backend (duckduckgo_search in global).
