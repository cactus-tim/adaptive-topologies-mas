[project]
name = "atm"
version = "0.1.0"
description = "Adaptive Topologies MAS — multi-agent LLM framework with HITL"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "asyncpg>=0.29",
    "langchain>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24",
    "tiktoken>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm"]

[dependency-groups]
dev = [
    {include-group = "test"},
    "alembic>=1.13",
    "mypy>=1.14",
    "pandas>=2.2",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260408",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF"]
ignore = ["E501"]  # line length is controlled by the formatter

[tool.ruff.format]
# defaults

[tool.pytest.ini_options]
# M0: error-on-warning оставлено сознательно; в M1+ может потребоваться ослабление
# (например, при появлении sqlalchemy MovedIn20Warning или pytest-asyncio deprecations).
filterwarnings = ["error"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/atm"]  # intentionally excludes alembic/ (M0 plan §Step 6 decision)
