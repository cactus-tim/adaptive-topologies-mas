[project]
name = "atm"
version = "0.1.0"
description = "Adaptive Topologies MAS — multi-agent LLM framework with HITL"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm"]

[dependency-groups]
dev = [
    {include-group = "test"},
    "alembic>=1.13",
    "asyncpg>=0.29",
    "mypy>=1.14",
    "ruff>=0.9",
    "sqlalchemy[asyncio]>=2.0",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
