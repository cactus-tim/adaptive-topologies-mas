[project]
name = "atm"
version = "0.1.0"
description = "Adaptive Topologies MAS — multi-agent LLM framework with HITL"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "asyncpg>=0.29",
    "datasets>=2.20,<4",
    "ddgs>=9.13,<10",
    "docker>=7.1,<8",
    "httpx>=0.27",
    "langchain>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-cerebras>=0.5,<0.6",  # pinned to 0.5.x — 0.6+ drops langchain-core<0.4 upper bound
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langgraph>=0.3,<1",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24",
    "tiktoken>=0.8",
    "typer>=0.12",
    "omegaconf>=2.3",
]

[project.scripts]
atm = "atm.experiment.cli:app"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.11"]
analysis = [
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "pandas>=2.2",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm"]

[dependency-groups]
dev = [
    {include-group = "test"},
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "langgraph>=0.3,<1",
    "matplotlib>=3.9",
    "mypy>=1.14",
    "nbformat>=5.10",
    "pandas>=2.2",
    "ruff>=0.9,<1",
    "seaborn>=0.13",
    "types-pyyaml>=6.0.12.20260408",
]
test = [
    "aiosqlite>=0.22.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF"]
ignore = ["E501"]  # line length is controlled by the formatter

[tool.ruff.lint.per-file-ignores]
# Pre-existing issues in Wave-1/Wave-2 files — fixed in place where allowed by scope
"src/atm/tools/sandbox/subprocess_sandbox.py" = ["I001", "UP041", "UP037", "SIM105"]
"tests/unit/tools/test_base.py" = ["I001", "F401", "B017"]
"tests/unit/tools/test_duckduckgo_search.py" = ["I001", "F401"]
"tests/unit/tools/test_retry.py" = ["N818"]
"tests/unit/tools/test_sandbox_base.py" = ["I001"]
"tests/unit/tools/test_subprocess_sandbox.py" = ["I001", "F401"]

[tool.ruff.format]
# defaults

[tool.pytest.ini_options]
# M0: error-on-warning оставлено сознательно; в M1+ может потребоваться ослабление
# (например, при появлении sqlalchemy MovedIn20Warning или pytest-asyncio deprecations).
filterwarnings = [
    "error",
    "ignore::RuntimeWarning:ddgs",
    "ignore::ResourceWarning:docker.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "docker: marks tests requiring a live Docker daemon (deselect with -m 'not docker')",
    "integration: marks tests as integration tests (require external services)",
    "network: marks tests requiring external network access (deselect with -m 'not network')",
    "requires_postgres: marks tests that require a live PostgreSQL instance (gate: ATM_ENABLE_PG_TESTS=1)",
]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/atm"]  # intentionally excludes alembic/ (M0 plan §Step 6 decision)
