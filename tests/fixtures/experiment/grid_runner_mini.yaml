# Mini grid fixture for M12 grid-runner integration tests.
#
# Sweep: topology.name × task.name × seeds → 2 × 1 × 2 = 4 cells.
# Note: integration tests can override sweep keys to vary cell counts.
#
# Uses FakeLLM scripted fixtures so the run is deterministic and PG-free
# beyond what _ensure_experiment / _insert_run themselves write.
name: m12_grid_mini

seed: 42

task:
  name: fibonacci_smoke
  input: "Write a Python function fib(n) that returns the n-th Fibonacci number. Compute fib(10)."

model:
  default: "fake:scripted"
  by_role:
    planner: "fake:scripted"
    executor: "fake:scripted"
    critic: "fake:scripted"
    researcher: "fake:scripted"
  fake_fixtures:
    planner: "tests/fixtures/llm/m6_star_planner.yaml"
    executor: "tests/fixtures/llm/m6_star_executor.yaml"
    critic: "tests/fixtures/llm/m6_star_critic.yaml"
    researcher: "tests/fixtures/llm/m6_star_planner.yaml"

agents:
  set: canonical_4

topology:
  name: star
  max_iterations: 4
  extra: {}

budget:
  per_call_usd: 0.10
  per_run_usd: 0.50
  per_experiment_usd: 50.0

observability:
  # Overridden by the test fixture (ephemeral_pg_dsn).
  pg_dsn: "${oc.env:PG_DSN,postgresql+asyncpg://localhost/atm_test}"
  parquet_dir: "data/experiments"
  callback_sync: true

grid:
  sweep:
    topology.name: ["star", "chain"]
  parallelism: 2
  fail_fast: false
  seeds: [42, 43]
