version: 1
mode: scripted
# Thrashing scenario: critic rejects 4 times before approving.
# After 3 rejects → Critic emits needs_debate=True + rejected_count >= 3.
# TopologyRouter (rule) then switches "linear" → "debate" (real switch).
# Subsequent rejects can trigger further switch attempts that the
# GuardedRouter blocks (decided_by="guard_override") given max_per_phase=1.
entries:
  - {agent_id: critic, role: critic, step_idx: 0, content: "REJECTED — needs improvement (1).", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 8, total_tokens: 108}, model: "fake:scripted"}
  - {agent_id: critic, role: critic, step_idx: 1, content: "REJECTED — still off (2).", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 8, total_tokens: 108}, model: "fake:scripted"}
  - {agent_id: critic, role: critic, step_idx: 2, content: "REJECTED — bugs remain (3).", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 8, total_tokens: 108}, model: "fake:scripted"}
  - {agent_id: critic, role: critic, step_idx: 3, content: "REJECTED — one more pass (4).", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 8, total_tokens: 108}, model: "fake:scripted"}
  - {agent_id: critic, role: critic, step_idx: 4, content: "APPROVED — looks good now.", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 8, total_tokens: 108}, model: "fake:scripted"}
  - {agent_id: critic, role: critic, step_idx: 5, content: "APPROVED.", tool_calls: [], finish_reason: stop, usage: {input_tokens: 100, output_tokens: 5, total_tokens: 105}, model: "fake:scripted"}
