version: 1
mode: scripted
# Scripted FakeLLM for ChainTopology HITL integration tests — Executor agent.
# The executor emits a DRAFT with the final answer in one step.
entries:
  - agent_id: executor
    role: executor
    step_idx: 0
    content: "fib(5)=5"
    tool_calls: []
    finish_reason: stop
    usage:
      input_tokens: 60
      output_tokens: 10
      total_tokens: 70
    model: "fake:scripted"
